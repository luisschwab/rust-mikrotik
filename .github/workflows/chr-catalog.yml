name: CHR Catalog

on:
    workflow_dispatch:

permissions: {}
env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    update-catalog:
        name: Fetch New Versions
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Rust Cache
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  cache-on-failure: true

            - name: Setup cargo-rbmt
              uses: $/.github/actions/setup-rbmt

            - name: Check Version Stress Manifest Coverage
              run: cargo test --locked -p mikrotik-qemu-runner --test scenarios version_stress_manifest_covers_catalog_exactly -- --exact

            - name: Fetch New CHR Version Images
              run: cargo run --locked -p mikrotik-qemu-runner --example check_chr_catalog
