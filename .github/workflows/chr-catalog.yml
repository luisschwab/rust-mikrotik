name: CHR Catalog

on:
    workflow_dispatch:

permissions: {}
env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    update-catalog:
        name: Fetch New Versions
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout Repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup Rust Cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  cache-on-failure: true

            - name: Setup cargo-rbmt
              uses: $/.github/actions/setup-rbmt

            - name: Check Version Stress Manifest Coverage
              run: cargo test --locked -p mikrotik-qemu-runner --test scenarios version_stress_manifest_covers_catalog_exactly -- --exact

            - name: Fetch New CHR Version Images
              run: cargo run --locked -p mikrotik-qemu-runner --example check_chr_catalog
